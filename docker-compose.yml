version: '3.8'

services:
  mytrello:
    image: ghcr.io/wadewatts9/mytrello:latest
    container_name: mytrello
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - mytrello_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3004
      - NEXTAUTH_URL=http://localhost:3004
      - NEXTAUTH_SECRET=change_this_secret_in_production

volumes:
  mytrello_data:
